[pytest]
testpaths = tests modbus_multi_device_package/tests
norecursedirs = manual .venv build dist release
addopts = -ra --strict-markers
pythonpath = . src modbus_multi_device_package
# A stalled Qt modal/thread must fail CI instead of waiting indefinitely.
timeout = 30
timeout_method = thread
filterwarnings =
    error::pytest.PytestCollectionWarning
    error::pytest.PytestReturnNotNoneWarning
