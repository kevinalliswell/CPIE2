[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modbus_multi_device"
version = "1.0.0"
description = "一个用于管理多个Modbus设备通信的Python包，支持数据采集轮询和控制命令优先级队列"
authors = [
    {name = "Kevin"}
]
readme = "readme.md"
requires-python = ">=3.9"
keywords = ["modbus", "serial", "communication", "multi-device", "data-acquisition"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

dependencies = [
    "pyserial>=3.5,<4.0",
    "pymodbus==3.8.6",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "colorama>=0.4.6",
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/kevinalliswell/modbus_multi_device"
Documentation = "https://github.com/kevinalliswell/modbus_multi_device/blob/main/api_doc.md"
Repository = "https://github.com/kevinalliswell/modbus_multi_device"
Issues = "https://github.com/kevinalliswell/modbus_multi_device/issues"

[tool.setuptools]
packages = ["modbus_multi_device"]

