<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPIE Logo Design</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        }
        
        .container {
            text-align: center;
        }
        
        .logo-canvas {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            display: inline-block;
        }
        
        canvas {
            display: block;
            border-radius: 10px;
        }
        
        .download-btn {
            margin-top: 20px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,114,255,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,114,255,0.4);
        }
        
        .download-btn:active {
            transform: translateY(0);
        }
        
        .info {
            margin-top: 15px;
            color: #666;
            font-size: 14px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CPIE Logo Design</h1>
        <div class="logo-canvas">
            <canvas id="logoCanvas" width="672" height="672"></canvas>
        </div>
        <div>
            <button class="download-btn" onclick="downloadLogo()">下载 Logo (PNG)</button>
        </div>
        <div class="info">
            尺寸: 672 x 672 像素 | 高分辨率PNG格式
        </div>
    </div>

    <script>
        const canvas = document.getElementById('logoCanvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        function drawLogo() {
            // 创建渐变背景
            const gradient = ctx.createLinearGradient(0, 0, width, height);
            gradient.addColorStop(0, '#00d4ff');
            gradient.addColorStop(0.5, '#0099ff');
            gradient.addColorStop(1, '#0066ff');
            
            // 绘制圆角矩形背景
            ctx.fillStyle = gradient;
            roundRect(ctx, 0, 0, width, height, 80);
            ctx.fill();

            // 绘制白色八边形框架
            ctx.save();
            ctx.translate(width / 2, height / 2 - 60);
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 28;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            
            const octagonRadius = 140;
            drawOctagon(ctx, 0, 0, octagonRadius);
            
            // 绘制橙黄色连接图案
            ctx.strokeStyle = '#FFA500';
            ctx.fillStyle = '#FFA500';
            ctx.lineWidth = 18;
            
            // 三个连接点
            const points = [
                { x: -50, y: 30 },
                { x: 20, y: -40 },
                { x: 65, y: 35 }
            ];
            
            // 绘制连接线
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            ctx.lineTo(points[1].x, points[1].y);
            ctx.lineTo(points[2].x, points[2].y);
            ctx.stroke();
            
            // 绘制圆点
            points.forEach(point => {
                ctx.beginPath();
                ctx.arc(point.x, point.y, 16, 0, Math.PI * 2);
                ctx.fill();
                
                // 内圈蓝色
                ctx.fillStyle = '#0088ff';
                ctx.beginPath();
                ctx.arc(point.x, point.y, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#FFA500';
            });
            
            ctx.restore();

            // 绘制 CPIE 文字
            ctx.fillStyle = 'white';
            ctx.font = 'bold 100px Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.letterSpacing = '5px';
            
            const text = 'CPIE';
            const textY = height / 2 + 150;
            ctx.fillText(text, width / 2, textY);

            // 绘制中文副标题
            ctx.font = '22px "Microsoft YaHei", "SimHei", sans-serif';
            ctx.fillText('北京科技大学 ', width / 2, height - 50);
        }

        function drawOctagon(ctx, x, y, radius) {
            ctx.beginPath();
            for (let i = 0; i < 8; i++) {
                const angle = (Math.PI / 4) * i - Math.PI / 8;
                const px = x + radius * Math.cos(angle);
                const py = y + radius * Math.sin(angle);
                if (i === 0) {
                    ctx.moveTo(px, py);
                } else {
                    ctx.lineTo(px, py);
                }
            }
            ctx.closePath();
            ctx.stroke();
        }

        function roundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        function downloadLogo() {
            const link = document.createElement('a');
            link.download = 'CPIE_LOGO_672x672.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // 绘制logo
        drawLogo();
    </script>
</body>
</html>
