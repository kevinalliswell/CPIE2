<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPIE Logo - 煤粉实验检测</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        }
        
        .container {
            text-align: center;
            max-width: 1200px;
        }
        
        .logo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin: 30px 0;
        }
        
        .logo-option {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        
        .logo-option:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.15);
        }
        
        canvas {
            display: block;
            border-radius: 10px;
            width: 100%;
            height: auto;
        }
        
        .option-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin: 15px 0 10px 0;
        }
        
        .option-desc {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
            line-height: 1.6;
        }
        
        .download-btn {
            padding: 10px 25px;
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .download-btn:hover {
            transform: scale(1.05);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CPIE Logo 设计方案</h1>
        <p class="subtitle">融合煤粉实验检测专业特征</p>
        
        <div class="logo-grid">
            <div class="logo-option">
                <canvas id="logo1" width="672" height="672"></canvas>
                <div class="option-title">方案一: 燃烧火焰检测</div>
                <div class="option-desc">
                    • 中心火焰图案象征煤粉燃烧<br>
                    • 圆形传感器阵列代表检测系统<br>
                    • 放射状线条表示温度/压力监测
                </div>
                <button class="download-btn" onclick="downloadCanvas('logo1', 'CPIE_燃烧检测')">下载此方案</button>
            </div>
            
            <div class="logo-option">
                <canvas id="logo2" width="672" height="672"></canvas>
                <div class="option-title">方案二: 管道反应器</div>
                <div class="option-desc">
                    • 垂直管道代表立式管式炉<br>
                    • 颗粒流动展示煤粉喷射<br>
                    • 波形图表示实时数据采集
                </div>
                <button class="download-btn" onclick="downloadCanvas('logo2', 'CPIE_管道反应器')">下载此方案</button>
            </div>
            
            <div class="logo-option">
                <canvas id="logo3" width="672" height="672"></canvas>
                <div class="option-title">方案三: 爆炸安全检测</div>
                <div class="option-desc">
                    • 防护六边形代表安全容器<br>
                    • 中心爆炸波纹模拟粉尘爆炸<br>
                    • 高速相机视野范围标识
                </div>
                <button class="download-btn" onclick="downloadCanvas('logo3', 'CPIE_爆炸检测')">下载此方案</button>
            </div>
        </div>
    </div>

    <script>
        // 方案一: 燃烧火焰检测
        function drawLogo1() {
            const canvas = document.getElementById('logo1');
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;

            // 渐变背景
            const gradient = ctx.createLinearGradient(0, 0, w, h);
            gradient.addColorStop(0, '#00d4ff');
            gradient.addColorStop(0.5, '#0099ff');
            gradient.addColorStop(1, '#0066ff');
            ctx.fillStyle = gradient;
            roundRect(ctx, 0, 0, w, h, 80);
            ctx.fill();

            ctx.save();
            ctx.translate(cx, cy - 60);

            // 绘制检测传感器圆环
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.lineWidth = 24;
            ctx.beginPath();
            ctx.arc(0, 0, 140, 0, Math.PI * 2);
            ctx.stroke();

            // 绘制8个传感器节点
            for (let i = 0; i < 8; i++) {
                const angle = (Math.PI / 4) * i;
                const x = Math.cos(angle) * 140;
                const y = Math.sin(angle) * 140;
                
                ctx.fillStyle = '#FFA500';
                ctx.beginPath();
                ctx.arc(x, y, 12, 0, Math.PI * 2);
                ctx.fill();
                
                // 辐射检测线
                ctx.strokeStyle = 'rgba(255, 165, 0, 0.5)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x * 1.3, y * 1.3);
                ctx.stroke();
            }

            // 中心火焰形状
            ctx.fillStyle = '#FF6B00';
            ctx.beginPath();
            ctx.moveTo(0, -60);
            ctx.bezierCurveTo(-20, -40, -30, -10, -25, 20);
            ctx.bezierCurveTo(-20, 35, -10, 45, 0, 50);
            ctx.bezierCurveTo(10, 45, 20, 35, 25, 20);
            ctx.bezierCurveTo(30, -10, 20, -40, 0, -60);
            ctx.fill();

            // 内层火焰
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.moveTo(0, -45);
            ctx.bezierCurveTo(-12, -30, -18, -5, -15, 15);
            ctx.bezierCurveTo(-10, 25, -5, 30, 0, 33);
            ctx.bezierCurveTo(5, 30, 10, 25, 15, 15);
            ctx.bezierCurveTo(18, -5, 12, -30, 0, -45);
            ctx.fill();

            ctx.restore();

            // CPIE 文字
            ctx.fillStyle = 'white';
            ctx.font = 'bold 160px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('CPIE', cx, cy + 220);

            // 中文副标题
            ctx.font = '22px "Microsoft YaHei"';
            ctx.fillText('北 京 科 技 大 学', cx, h - 50);
        }

        // 方案二: 管道反应器
        function drawLogo2() {
            const canvas = document.getElementById('logo2');
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;

            // 渐变背景
            const gradient = ctx.createLinearGradient(0, 0, w, h);
            gradient.addColorStop(0, '#00d4ff');
            gradient.addColorStop(0.5, '#0099ff');
            gradient.addColorStop(1, '#0066ff');
            ctx.fillStyle = gradient;
            roundRect(ctx, 0, 0, w, h, 80);
            ctx.fill();

            ctx.save();
            ctx.translate(cx, cy - 60);

            // 绘制垂直管道轮廓
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 28;
            ctx.lineJoin = 'round';
            
            // 管道主体
            ctx.beginPath();
            ctx.moveTo(-70, -120);
            ctx.lineTo(-70, 100);
            ctx.lineTo(70, 100);
            ctx.lineTo(70, -120);
            ctx.stroke();

            // 管道顶部进料口
            ctx.beginPath();
            ctx.moveTo(-50, -120);
            ctx.lineTo(-50, -150);
            ctx.moveTo(50, -120);
            ctx.lineTo(50, -150);
            ctx.stroke();

            // 煤粉颗粒流动轨迹
            const particles = [
                {x: -40, y: -130, size: 8},
                {x: 0, y: -100, size: 10},
                {x: 30, y: -60, size: 9},
                {x: -20, y: -20, size: 11},
                {x: 10, y: 20, size: 8},
                {x: -30, y: 60, size: 10}
            ];

            particles.forEach(p => {
                ctx.fillStyle = '#FFA500';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // 流动连接线
            ctx.strokeStyle = 'rgba(255, 165, 0, 0.4)';
            ctx.lineWidth = 3;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(particles[0].x, particles[0].y);
            for (let i = 1; i < particles.length; i++) {
                ctx.lineTo(particles[i].x, particles[i].y);
            }
            ctx.stroke();
            ctx.setLineDash([]);

            // 温度/压力传感器
            [-90, 0, 90].forEach(yPos => {
                ctx.strokeStyle = '#FFD700';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(70, yPos);
                ctx.lineTo(95, yPos);
                ctx.stroke();
                
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(95, yPos, 6, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.restore();

            // CPIE 文字
            ctx.fillStyle = 'white';
            ctx.font = 'bold 160px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('CPIE', cx, cy + 220);

            // 中文副标题
            ctx.font = '22px "Microsoft YaHei"';
            ctx.fillText('北 京 科 技 大 学', cx, h - 50);
        }

        // 方案三: 爆炸安全检测
        function drawLogo3() {
            const canvas = document.getElementById('logo3');
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;

            // 渐变背景
            const gradient = ctx.createLinearGradient(0, 0, w, h);
            gradient.addColorStop(0, '#00d4ff');
            gradient.addColorStop(0.5, '#0099ff');
            gradient.addColorStop(1, '#0066ff');
            ctx.fillStyle = gradient;
            roundRect(ctx, 0, 0, w, h, 80);
            ctx.fill();

            ctx.save();
            ctx.translate(cx, cy - 60);

            // 防护六边形容器
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 26;
            ctx.lineJoin = 'round';
            
            const hexRadius = 130;
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i - Math.PI / 2;
                const x = Math.cos(angle) * hexRadius;
                const y = Math.sin(angle) * hexRadius;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.stroke();

            // 爆炸冲击波 (多层圆环)
            const shockWaves = [30, 60, 90];
            shockWaves.forEach((radius, index) => {
                ctx.strokeStyle = `rgba(255, 165, 0, ${0.7 - index * 0.2})`;
                ctx.lineWidth = 18 - index * 4;
                ctx.beginPath();
                ctx.arc(0, 0, radius, 0, Math.PI * 2);
                ctx.stroke();
            });

            // 中心爆炸点
            const explosionGradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 25);
            explosionGradient.addColorStop(0, '#FFFF00');
            explosionGradient.addColorStop(0.5, '#FF6B00');
            explosionGradient.addColorStop(1, '#FF0000');
            ctx.fillStyle = explosionGradient;
            ctx.beginPath();
            ctx.arc(0, 0, 25, 0, Math.PI * 2);
            ctx.fill();

            // 爆炸射线
            for (let i = 0; i < 12; i++) {
                const angle = (Math.PI / 6) * i;
                const startR = 30;
                const endR = 50;
                
                ctx.strokeStyle = '#FFD700';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(Math.cos(angle) * startR, Math.sin(angle) * startR);
                ctx.lineTo(Math.cos(angle) * endR, Math.sin(angle) * endR);
                ctx.stroke();
            }

            // 高速相机视野角
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.5)';
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 4]);
            
            // 左上角相机视野
            ctx.beginPath();
            ctx.moveTo(-140, -140);
            ctx.lineTo(-80, -80);
            ctx.moveTo(-140, -140);
            ctx.lineTo(-120, -160);
            ctx.stroke();
            
            // 右上角相机视野
            ctx.beginPath();
            ctx.moveTo(140, -140);
            ctx.lineTo(80, -80);
            ctx.moveTo(140, -140);
            ctx.lineTo(120, -160);
            ctx.stroke();
            
            ctx.setLineDash([]);

            ctx.restore();

            // CPIE 文字
            ctx.fillStyle = 'white';
            ctx.font = 'bold 160px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('CPIE', cx, cy + 240);

            // 中文副标题
            ctx.font = '22px "Microsoft YaHei"';
            ctx.fillText('北 京 科 技 大 学', cx, h - 50);
        }

        function roundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        function downloadCanvas(canvasId, filename) {
            const canvas = document.getElementById(canvasId);
            const link = document.createElement('a');
            link.download = `${filename}_672x672.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // 绘制所有logo
        drawLogo1();
        drawLogo2();
        drawLogo3();
    </script>
</body>
</html>
