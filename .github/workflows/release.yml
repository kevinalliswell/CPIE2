name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-release:
    name: Build Windows release
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # pymodbus>=3.10 (required for the device_id= keyword used by modbus_multi_device)
          # only supports Python 3.10+; building on 3.9 silently resolves pymodbus 3.8.x
          # whose client API has no device_id argument and every Modbus call fails at runtime.
          python-version: '3.11'

      - name: Derive release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_TAG="${GITHUB_REF_NAME}"
            VERSION="${VERSION_TAG#v}"
            IS_RELEASE=true
          else
            # workflow_dispatch on a branch: build only, keep the version from software.info
            VERSION="$(python -c "import json; print(json.load(open('configs/software.info', encoding='utf-8'))['version'])")"
            VERSION_TAG="v${VERSION}"
            IS_RELEASE=false
          fi
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Sync software version metadata
        if: steps.version.outputs.is_release == 'true'
        shell: python
        run: |
          import json
          from pathlib import Path

          config_path = Path("configs/software.info")
          data = json.loads(config_path.read_text(encoding="utf-8"))
          data["version"] = "${{ steps.version.outputs.version }}"
          config_path.write_text(
              json.dumps(data, ensure_ascii=False, indent=4) + "\n",
              encoding="utf-8",
          )

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e flame_package -e modbus_multi_device_package

      - name: Build release package
        shell: bash
        run: python build_release.py

      - name: Verify release artifacts
        shell: bash
        run: |
          ls -la release
          test -n "$(ls -A release/*.zip 2>/dev/null)"
          test -n "$(ls -A release/*_info.json 2>/dev/null)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CPIE-${{ steps.version.outputs.version }}-windows
          path: |
            release/*.zip
            release/*_info.json

      - name: Create GitHub Release
        # Only publish a release for v* tags; a manual run on a branch must not
        # create a release/tag named after the branch (e.g. "main").
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version_tag }}
          name: CPIE ${{ steps.version.outputs.version_tag }}
          generate_release_notes: true
          files: |
            release/*.zip
            release/*_info.json
