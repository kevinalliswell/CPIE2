name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z), matching configs/software.info
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Validate release tag and source version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve an existing version tag
        id: version
        shell: python
        run: |
          import json, os, re, subprocess
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', tag):
              raise SystemExit('Release requires an existing vX.Y.Z tag, not a branch name')
          commit = subprocess.check_output(['git', 'rev-parse', '--verify', f'refs/tags/{tag}^{{commit}}'], text=True).strip()
          metadata = json.loads(subprocess.check_output(['git', 'show', f'{commit}:configs/software.info'], text=True))
          if metadata['version'] != tag[1:]:
              raise SystemExit('Tag and configs/software.info version must match; source metadata is never rewritten during release')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'tag={tag}\ncommit={commit}\n')

  validate:
    name: Validate and build the tagged source
    needs: resolve
    uses: ./.github/workflows/windows-validation.yml
    secrets:
      FLAMEKIT_DEPLOY_KEY: ${{ secrets.FLAMEKIT_DEPLOY_KEY }}
    with:
      ref: ${{ needs.resolve.outputs.commit }}

  publish:
    name: Publish only the verified candidate
    needs: [resolve, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-candidate
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: CPIE ${{ needs.resolve.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.zip
            release/*_info.json
            release/*.sha256
