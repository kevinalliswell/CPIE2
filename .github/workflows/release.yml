name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-release:
    name: Build Windows release
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Derive release version
        id: version
        shell: bash
        run: |
          VERSION_TAG="${GITHUB_REF_NAME}"
          VERSION="${VERSION_TAG#v}"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Sync software version metadata
        shell: python
        run: |
          import json
          from pathlib import Path

          config_path = Path("configs/software.info")
          data = json.loads(config_path.read_text(encoding="utf-8"))
          data["version"] = "${{ steps.version.outputs.version }}"
          config_path.write_text(
              json.dumps(data, ensure_ascii=False, indent=4) + "\n",
              encoding="utf-8",
          )

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e flame_package -e modbus_multi_device_package

      - name: Build release package
        shell: bash
        run: python build_release.py

      - name: Verify release artifacts
        shell: bash
        run: |
          ls -la release
          test -n "$(ls -A release/*.zip 2>/dev/null)"
          test -n "$(ls -A release/*_info.json 2>/dev/null)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version_tag }}
          name: CPIE ${{ steps.version.outputs.version_tag }}
          generate_release_notes: true
          files: |
            release/*.zip
            release/*_info.json
